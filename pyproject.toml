[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soup-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for Soup: dataset intelligence, leakage diffing, VRAM estimation, Autopilot config generation, and validation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shubham", email = "shubham@example.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "soup-cli>=0.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
soup-mcp = "soup_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soup_mcp"]
